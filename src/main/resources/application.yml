server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.cz.czaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# Sa-Token 用户鉴权配置
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  # JWT 无状态令牌：登录态由令牌本身携带，不依赖后端内存会话，
  # 页面刷新、后端重启后旧令牌依然有效（生产环境请通过环境变量覆盖 jwt-secret-key）
  token-style: jwt
  is-log: false
  # JWT 签名密钥（无状态 JWT 必需）：生产环境请通过环境变量覆盖，勿将固定密钥提交到公开仓库
  jwt-secret-key: cz-ai-agent-jwt-secret-key-2026-please-override-in-prod



