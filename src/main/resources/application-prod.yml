spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      read-timeout: 300
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen3.6-flash}
          multi-model: true
    # 云端镜像中没有 MCP 子服务 JAR,使用空配置避免启动时拉起子进程失败
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-image-servers-prod.json
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 腾讯云 CynosDB 云数据库（外网）：sh-cynosdbmysql-grp-lm6g1bpw.sql.tencentcdb.com:25300 / 库名 cz_ai_agent
    # 密码请在微信云托管环境变量 MYSQL_PASSWORD 配置，勿写死到配置/镜像中
    url: ${MYSQL_URL:jdbc:mysql://sh-cynosdbmysql-grp-lm6g1bpw.sql.tencentcdb.com:25300/czaiagent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
baidu:
  translate:
    app-id: ${BAIDU_TRANSLATE_APP_ID:}
    security-key: ${BAIDU_TRANSLATE_SECRET:}
search-api:
  api-key: ${SEARCH_API_KEY:}
sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:cz-ai-agent-jwt-secret-key-2026-please-override-in-prod}
