#            server1:
#              url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-image-servers.json

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture
    username: root
    password: 123456
  # 默认加载的配置文件是application-local.yml
  profiles:
    active: local


