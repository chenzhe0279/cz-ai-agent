spring:
  application:
    name: cz-ai-agent
    # 数据库配置
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/yu_picture
      username: root
      password: 123456
  # 默认加载的配置文件是application-local.yml
  profiles:
    active: local
  #ai:
    #ollama:
      #base-url: http://localhost:11434
      #chat:
        #model: gemma3:1b

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.cz.czaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn





