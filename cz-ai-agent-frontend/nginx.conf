# =============================================================================
# cz-ai-agent-frontend Nginx 配置（微信云托管）
# 默认仅托管静态资源 dist/；如需"同域/同服务"反代后端，请启用下方 /api 块，
# 并把 proxy_pass 改成真实后端地址。两种方式二选一：
#   - 方式 A：前端用环境变量 VITE_API_BASE_URL 直接指向后端完整公网地址（跨域，需后端 CORS）
#   - 方式 B：本文件启用 /api 反代到后端（同域，无需跨域），则 VITE_API_BASE_URL 可留空
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩，减少静态资源体积
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由兜底（本项目使用 #hash 路由，刷新不会 404；此处留作扩展）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 可选：反向代理后端（方式 B，启用时替换 proxy_pass 为真实后端地址） ----------
    # location /api/ {
    #     proxy_pass http://<后端地址>/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_http_version 1.1;
    #     # SSE / 流式输出必须关闭缓冲并调大超时
    #     proxy_buffering off;
    #     proxy_read_timeout 600s;
    # }
}
